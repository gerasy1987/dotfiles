# hyprpaper >= 0.8 (hyprtoolkit rewrite): wallpapers are `wallpaper {}` blocks keyed by
# monitor; `preload` and the one-line `wallpaper = monitor, path` form no longer exist.
# Empty monitor = every output. fit_mode: cover | contain | fill | tile.

wallpaper {
    monitor =
    path = ~/Pictures/gowall/neon_astronaut.jpg
    fit_mode = cover
}

splash = false
